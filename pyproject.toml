[project]
name = "dasc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Niekrenz82", email = "cuniekrenz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
dasc = "dasc:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
